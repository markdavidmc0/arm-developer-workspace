[project]
name = "arm-developer-workspace"
version = "0.1.0"
description = "Arm Developer Workspace AI Tools & Golden Path Workloads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "logfire>=2.0.0",
    "opentelemetry-api>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "mcp_tools"]
