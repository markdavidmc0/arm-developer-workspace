name: Publish Workspace Tools OCI Image to GCP Artifact Registry

on:
  push:
    branches: [ main ]
    paths:
      - 'mcp_tools/**'
      - 'workloads/**'
      - 'Dockerfile.tools'
  workflow_dispatch:

jobs:
  build-and-push-tools:
    name: Build & Push OCI Tool Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/531238910401/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gke-sandbox-sa@sovereign-ai-495715.iam.gserviceaccount.com'
          audience: 'https://iam.googleapis.com/projects/531238910401/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          token_format: 'access_token'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Workspace Tools Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tools
          push: true
          tags: |
            us-central1-docker.pkg.dev/sovereign-ai-495715/mcp-tools/arm-workspace-tools:latest
            us-central1-docker.pkg.dev/sovereign-ai-495715/mcp-tools/arm-workspace-tools:${{ github.sha }}
