name: Publish Workspace Tools OCI Image to GCP Artifact Registry

on:
  push:
    branches: [ main ]
    paths:
      - 'mcp_tools/**'
      - 'workloads/**'
      - 'Dockerfile.tools'
      - '.github/workflows/publish_tools.yml'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-push-tools:
    name: Build & Push Arm64 OCI Tool Image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/389363417412/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'mvcp-github-ci-sa@sovereign-ai-495715.iam.gserviceaccount.com'

      - name: Set up Cloud SDK & GKE Auth Plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Set up QEMU for Arm64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (Cache Optimization)
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Arm64 Workspace Tools Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.tools
          platforms: linux/arm64
          push: true
          tags: |
            us-central1-docker.pkg.dev/sovereign-ai-495715/mcp-tools/arm-workspace-tools:latest
            us-central1-docker.pkg.dev/sovereign-ai-495715/mcp-tools/arm-workspace-tools:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
