name: Arm Platform A/B Performance Benchmark Suite

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mcp_tools/**'
      - 'workloads/**'
      - 'scripts/run_platform_benchmark_suite.py'
      - 'scripts/common_logging.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/platform-benchmark.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mcp_tools/**'
      - 'workloads/**'
      - 'scripts/run_platform_benchmark_suite.py'
      - 'scripts/common_logging.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/platform-benchmark.yml'
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  run-platform-benchmarks:
    runs-on: arm-developer-workspace-runner  # ARC Kubernetes Ephemeral Runner
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies via uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync

      - name: Run Platform Benchmark Suite
        env:
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
        run: |
          uv run python scripts/run_platform_benchmark_suite.py

      - name: Post Benchmark Summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('platform_benchmark_results.md')) {
              const report = fs.readFileSync('platform_benchmark_results.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }
